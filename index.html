<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gericht</title>
    <link href="./css/main.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/bestermind" rel="stylesheet">
    
    
</head>
<body>
    <!-- here we start header -->
     <header class="header">
        <div class="container header__container">
            <a href="" class="header__logo"></a>
            <nav class="header__navbar">
                <ul class="header__navbar-list">
                    <li class="header__navbar-item"><a href="" class="header__navbar-link"></a></li>
                    <li class="header__navbar-item"><a href="" class="header__navbar-link"></a></li>
                    <li class="header__navbar-item"><a href="" class="header__navbar-link"></a></li>
                    <li class="header__navbar-item"><a href="" class="header__navbar-link"></a></li>
                    <li class="header__navbar-item"><a href="" class="header__navbar-link"></a></li>
                </ul>
            </nav>
            <ul class="header__contact-list">
                <li class="header__contact-item"></li>
                <svg class="header__contact-separator"></svg>
                <li class="header__contact-item"></li>
            </ul>

        </div>
     </header>
      <section class="hero">
        <div class="container">
            <div class="hero__wrapper">
                <div class="hero__hashtag">
                    <a href="" class="hero__hashtag-text"></a>
                    <a href="" class="hero__hashtag-text"></a>
                </div>
                <div class="hero__content">
                    <p class="subtitle subtitle--hero"></p>
                    <svg class="spoon spoon--hero"></svg>
                    <h1 class="hero__content-title"></h1>
                    <p class="hero__content-text"></p>
                    <button class="button button--hero"></button>
                </div>
                <img src="./images/home/hero-eggs.jpg" alt="egg sandwich" class="hero__img">
            </div>
        </div>
      </section>
      <section class="information">
        <div class="container information__container">
            <div class="information__section information__section--left">
                <h2 class="title"></h2>
                <svg class="spoon__reverse spoon__reverse--information"></svg>
                <p class="information__section-text"></p>
                <button class="button button--information"></button>
            </div>
            <img src="./images/home/knife.png" alt="knife" class="information__image">
            <div class="information__section information__section--right">
                <h2 class="title"></h2>
                <svg class="spoon spoon--information"></svg>
                <p class="information__section-text"></p>
                <button class="button button--information"></button>
            </div>
        </div>
      </section>
           <section class="reservation">
            <div class="container reservation__container">
                <p class="subtitle subtitle--reservation"></p>
                <svg class="spoon spoon--reservation"></svg>
                <h2 class="title title--reservation"></h2>
                <ul class="reservation__list">
                    <li class="reservation__item">
                        <select name="" id="" class="reservation__select">
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                        </select>
                    </li>
                    <li class="reservation__item">
                        <select name="" id="" class="reservation__select">
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                        </select>
                    </li>
                    <li class="reservation__item">
                        <select name="" id="" class="reservation__select">
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                            <option value="" class="reservation__select-option"></option>
                        </select>
                    </li>
                </ul>
                <button class="button button--reservation"></button>
            </div>
           </section>
           <section class="menu">
            <div class="container">
                <ul class="menu__list">
                    <li class="menu__item"><a href="" class="menu__link"></a></li>
                    <li class="menu__item"><a href="" class="menu__link"></a></li>
                    <li class="menu__item"><a href="" class="menu__link"></a></li>
                </ul>
            </div>
           </section>
</body>
</html>
